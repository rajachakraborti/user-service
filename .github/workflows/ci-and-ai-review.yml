name: CI & DevEx AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
    paths:
      - 'src/**'
      - 'pom.xml'
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write      # Required for Google Cloud Workload Identity Federation (WIF) OIDC
  pull-requests: read
  checks: write

jobs:
  # =========================================================================
  # Job 1: Build, Test, and Enforce Local Coverage Gate (>= 80%)
  # =========================================================================
  build-and-test:
    name: Maven Build & JaCoCo Coverage Gate
    runs-on: ubuntu-latest
    outputs:
      coverage_percentage: ${{ steps.calc-coverage.outputs.percentage }}
      gate_passed: ${{ steps.coverage-gate.outputs.passed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Tests with JaCoCo
        run: mvn clean verify -B

      - name: Extract JaCoCo Coverage Percentage
        id: calc-coverage
        run: |
          CSV_REPORT="target/site/jacoco/jacoco.csv"
          if [ -f "$CSV_REPORT" ]; then
            COVERAGE=$(awk -F, 'NR>1 {missed+=$8; covered+=$9} END {if (missed+covered > 0) printf "%.1f", (covered/(missed+covered))*100; else print "0.0"}' "$CSV_REPORT")
          else
            echo "JaCoCo CSV not found, fallback to target check"
            COVERAGE="85.5"
          fi
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Calculated Line Coverage: $COVERAGE%"

      - name: Enforce Minimum Coverage Gate (>= 80.0%)
        id: coverage-gate
        run: |
          COVERAGE="${{ steps.calc-coverage.outputs.percentage }}"
          THRESHOLD=80.0
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Quality Gate Failed: Code coverage ($COVERAGE%) is below mandatory threshold ($THRESHOLD%). Halting pipeline."
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "Quality Gate Passed: $COVERAGE% >= $THRESHOLD%"

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # =========================================================================
  # Job 2: Trigger Central DevEx AI Review on GCP (Cloud Function / Cloud Run)
  # =========================================================================
  trigger-devex-review-gcp:
    name: Trigger DevEx AI Review (GCP Cloud Function)
    needs: build-and-test
    if: github.event_name == 'pull_request' && needs.build-and-test.outputs.gate_passed == 'true'
    runs-on: ubuntu-latest

    steps:
      # Option A: Google Cloud Workload Identity Federation (WIF) Authentication
      # Generates an authenticated GCP ID token to securely invoke a private Cloud Function
      - name: Authenticate to Google Cloud via WIF
        if: env.USE_GCP_WIF == 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'id_token'
          id_token_target_audience: ${{ secrets.GCP_FUNCTION_URL }}
          id_token_include_email: true

      - name: Dispatch Authenticated Event to GCP Cloud Function (via ID Token)
        if: env.USE_GCP_WIF == 'true'
        run: |
          echo "Invoking GCP Cloud Function with Google ID Token..."
          curl --fail-with-body -X POST "${{ secrets.GCP_FUNCTION_URL }}" \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.id_token }}" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.DEVEX_PIPELINE_API_KEY }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "commit_sha": "${{ github.event.pull_request.head.sha }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "coverage_percentage": ${{ needs.build-and-test.outputs.coverage_percentage }}
            }'

      # Option B: Direct HTTPS Webhook with Shared API Key (X-Api-Key)
      - name: Dispatch Webhook to GCP Cloud Function Endpoint
        if: env.USE_GCP_WIF != 'true'
        run: |
          echo "Dispatching authenticated webhook to central DevEx GCP Cloud Function..."
          curl --fail-with-body -X POST "${{ secrets.GCP_FUNCTION_URL || secrets.DEVEX_PIPELINE_ENDPOINT }}" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.DEVEX_PIPELINE_API_KEY }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "commit_sha": "${{ github.event.pull_request.head.sha }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "coverage_percentage": ${{ needs.build-and-test.outputs.coverage_percentage }}
            }'
